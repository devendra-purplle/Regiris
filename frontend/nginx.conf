server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Regulatory PDFs can be several MB
    client_max_body_size 50m;

    # Re-resolve service names via Docker DNS so restarted containers (new IPs) are picked up
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $ingestion_upstream http://ingestion-service:8081;
    set $core_upstream http://core-api-service:8000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy ingestion service
    location /api/v1/ingest/ {
        proxy_pass $ingestion_upstream;
        proxy_read_timeout 300s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy core API service
    location /api/v1/ {
        proxy_pass $core_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
